name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "current"
      - name: Look up Litematica and malilib versions for 1.21.11
        run: |
          get() { curl -s -G "https://api.modrinth.com/v2/project/$1/version" --data-urlencode 'game_versions=["1.21.11"]' --data-urlencode 'loaders=["fabric"]' | jq -r '.[0].id'; }
          echo "LITEMATICA_ID=$(get litematica)" >> $GITHUB_ENV
          echo "MALILIB_ID=$(get malilib)" >> $GITHUB_ENV
      - name: Build
        run: gradle build -Plitematica_version=$LITEMATICA_ID -Pmalilib_version=$MALILIB_ID
      - uses: actions/upload-artifact@v4
        with:
          name: layerbuilder-jar
          path: build/libs/*.jar
